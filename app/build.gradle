plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
//    id 'com.google.gms.google-services'
//    id 'com.google.firebase.crashlytics'
}

// defs from the root level build.gradle
def cfg  = rootProject.ext.configuration
def libs = rootProject.ext.libs

android {
    namespace "org.qstuff.qdeq"

    compileSdkVersion cfg.compileSdkVersion
    buildToolsVersion cfg.buildToolsVersion

    defaultConfig {
        applicationId cfg.applicationId

        minSdkVersion cfg.minSdkVersion
        targetSdkVersion cfg.targetSdkVersion
        versionCode cfg.versionCommitCount
        versionName cfg.versionName
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner 'android.support.test.runner.AndroidJUnitRunner'

    }

    android {
        lintOptions {
            abortOnError false
        }
    }

    buildTypes {

        debug {
            signingConfig android.signingConfigs.debug
        }

        beta {
            signingConfig android.signingConfigs.debug

            minifyEnabled true
            debuggable true

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

//            firebaseCrashlytics {
//                nativeSymbolUploadEnabled true
//            }
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    namespace 'org.qstuff.qplayer'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$libs.kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$libs.coroutines"
    implementation "com.android.support:multidex:$libs.multidex"

    implementation "com.google.android.material:material:$libs.material"

    implementation "androidx.core:core-ktx:$libs.ktx"
    implementation "androidx.appcompat:appcompat:$libs.appcompat"
    implementation "androidx.constraintlayout:constraintlayout:$libs.constraintLayout"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$libs.lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$libs.lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$libs.lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$libs.lifecycle"
    implementation "androidx.preference:preference-ktx:$libs.preference"

    // Room
    implementation "androidx.room:room-runtime:$libs.room"
    kapt "androidx.room:room-compiler:$libs.room"
    implementation "androidx.room:room-ktx:$libs.room"

    // Koin module injection
    implementation "io.insert-koin:koin-android:$libs.koin"

    // Compose
    def composeBom = platform("androidx.compose:compose-bom:2024.02.00")
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Media3 (ExoPlayer) — replaces Superpowered for playback + pitch/tempo
    implementation "androidx.media3:media3-exoplayer:$libs.media3"
    implementation "androidx.media3:media3-common:$libs.media3"

    // Logging
    implementation "com.jakewharton.timber:timber:$libs.timber"

    // Gson
    implementation "com.google.code.gson:gson:$libs.gson"

    // Crash reporting
//    implementation "com.google.firebase:firebase-core:$libs.firebase"
//    implementation "com.google.firebase:firebase-crashlytics:$libs.crashlytics"

    testImplementation "junit:junit:$libs.jUnit"
    androidTestImplementation "androidx.test:runner:$libs.espressoRunner"
    androidTestImplementation "androidx.test.espresso:espresso-core:$libs.espresso"

}

// apply plugin: 'com.google.gms.google-services'