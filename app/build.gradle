apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

// path to the superpowered SDK
def superpowered_sdk_path = properties.getProperty('superpowered.dir')

// defs from the root level build.gradle
def cfg  = rootProject.ext.configuration
def libs = rootProject.ext.libs

android {
    compileSdkVersion cfg.compileSdkVersion
    buildToolsVersion cfg.buildToolsVersion

    defaultConfig {
        applicationId cfg.applicationId

        minSdkVersion cfg.minSdkVersion
        targetSdkVersion cfg.targetSdkVersion
        versionCode cfg.versionCode
        versionName cfg.versionName

        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner 'android.support.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            System.out.println("==============")
            cmake {

                arguments   '-DANDROID_PLATFORM=android-19',
                        '-DANDROID_TOOLCHAIN=clang',
                        '-DANDROID_ARM_NEON=TRUE',
                        '-DANDROID_STL=c++_static',
                        "-DPATH_TO_SUPERPOWERED:STRING=${superpowered_sdk_path}"

                cFlags '-O3', '-fsigned-char' // full optimization, char data type is signed
                cppFlags '-fsigned-char', "-I${superpowered_sdk_path}"
            }
        }
    }

    android {
        lintOptions {
            abortOnError false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jni']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
        }
    }

    buildTypes {

        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix "-dev"

            signingConfig android.signingConfigs.debug;
        }

        beta {
            applicationIdSuffix '.beta'
            versionNameSuffix "-beta"

            signingConfig android.signingConfigs.debug;

            minifyEnabled true
            debuggable true

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "com.android.support:support-v4:${libs.support}"
    implementation "com.android.support:recyclerview-v7:${libs.support}"
    implementation "com.android.support:cardview-v7:${libs.support}"
    implementation "com.android.support:appcompat-v7:${libs.support}"

    implementation "com.android.support.constraint:constraint-layout:${libs.constraintLayout}"

    implementation "android.arch.lifecycle:extensions:${libs.archComponents}"
    implementation "android.arch.persistence.room:runtime:${libs.archComponents}"
    annotationProcessor "android.arch.persistence.room:compiler:${libs.archComponents}"

    testImplementation 'junit:junit:4.12'

    implementation "com.crashlytics.sdk.android:crashlytics:${libs.crashlytics}"

    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation "com.android.support.test.espresso:espresso-core:${libs.espresso}", {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
}
apply plugin: 'com.google.gms.google-services'