# Xcode project of the iOS app, generated with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd iosApp && xcodegen
# The generated iosApp.xcodeproj is committed too, so the project opens without XcodeGen. After
# editing this file, run xcodegen again and commit both.
name: iosApp
options:
  bundleIdPrefix: org.qstuff
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: qdeq
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        # The app's Documents folder is visible in the Files app and in Finder (music to play).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Like Android: iPhone portrait, iPad landscape (two-pane layout)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        # Playback continues in the background / on the lock screen
        UIBackgroundModes:
          - audio
        # Light status bar text on the black app
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.qstuff.qdeq
        PRODUCT_NAME: qdeq
        # App icon: iosApp/Assets.xcassets/AppIcon (rendered from the Android launcher icon vector)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # The Kotlin framework (shared module), built by the script phase below
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode has no JAVA_HOME: prefer Android Studio's bundled JDK (arm64) if there is one.
          if [ -z "$JAVA_HOME" ]; then
            for jbr in "/Applications/Android Studio"*.app/Contents/jbr/Contents/Home; do
              [ -x "$jbr/bin/java" ] && export JAVA_HOME="$jbr"
            done
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
